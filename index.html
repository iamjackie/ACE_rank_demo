<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>万象王牌 · 世界排行榜</title>
  <!-- Google Fonts: 免费近似字形,优先加载,失败则降级 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&family=Inter:wght@400;600;700&family=Dancing+Script:wght@700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
     * 设计 Token —— 全部来自 Figma frame 29:957 节点实测值
     * 坐标均为 frame 内坐标(frame 左上角为 0,0)
     * 字体策略: Figma 商用字体 → Google Fonts 免费近似
     *   MF FangHei (Noncommercial) → Noto Sans SC
     *   Kalista Script → Dancing Script
     *   DIN Next LT Pro → Bebas Neue
     *   HYQiHei → Noto Sans SC (800)
     *   Inter → Inter (Google Fonts 提供)
     * ============================================================ */
    :root {
      /* 字体 */
      --font-title: 'Noto Sans SC', 'MF FangHei (Noncommercial)', 'PingFang SC', sans-serif;
      --font-script: 'Dancing Script', 'Kalista Script', 'Pacifico', cursive;
      --font-cn: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-num: 'Bebas Neue', 'DIN Next LT Pro', 'Arial', sans-serif;
      --font-en: 'Inter', sans-serif;
      --font-hei: 'Noto Sans SC', 'HYQiHei', 'PingFang SC', sans-serif;
      /* 文字色 */
      --c-white: #ffffff;
      --c-text-sub: #bfc4d9;
      --c-table-text: #0b1439;
      --c-score: #405390;

      /* ============================================================
       * 响应式断点常量 —— 与 docs/world-rank-mobile/phase-0-baseline.md 一致
       *   <768px        手机(phone)
       *   768–1280px    平板(tablet)
       *   ≥1280px       桌面(desktop,零回归基准,不在此框架内改动)
       * ============================================================ */
      --bp-tablet: 768px;      /* 平板下界(手机<768) */
      --bp-desktop: 1280px;    /* 桌面上界(平板<1280,桌面≥1280 保持绝对定位坐标规则不变) */

      /* 骨架级缩放 token(供后续 T1.2/T2.x 重排复用,本卡仅定义) */
      --fs-scale-tablet: 0.85;   /* 平板字号缩放系数 */
      --fs-scale-phone: 0.72;    /* 手机字号缩放系数 */
      --sp-scale-tablet: 0.85;   /* 平板间距缩放系数 */
      --sp-scale-phone: 0.72;    /* 手机间距缩放系数 */
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-cn);
      color: var(--c-white);
      /* 背景主色取 bg 图底部浅蓝紫(#8797b7),滚动露出区域与背景图底部无缝衔接 */
      background: #8797b7;
      min-height: 100vh;
      overflow-x: auto;        /* 移动端允许横向滚动查看完整 canvas */
    }

    /* 响应式缩放容器:canvas 固定 1920 设计稿,实际渲染时按视口宽度等比缩放 */
    .stage {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      /* canvas 缩放后宽度可能超出,允许 stage 内部溢出 */
    }
    .stage__inner {
      position: relative;
      width: 1920px;
      transform-origin: top center;
    }

    /* 画布容器：固定 1920 宽居中，高度随内容(JS 动态撑开) */
    .canvas {
      position: relative;
      width: 1920px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ============================================================
     * 背景层：完整还原 Figma bg 底图(29:959)
     * position:fixed 铺满可视区域,滚动不跟随;
     * object-fit:cover 让超宽/超长屏等比裁切铺满,不露白不拉伸
     * 注意:必须置于 .stage__inner 之外,否则其 transform 会劫持
     *       containing block,导致 fixed 相对 1920 画布定位而两侧露底
     * ============================================================ */
    .bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg__base {
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 1;
    }

    /* ============================================================
     * 顶部导航 (top, frame内 x=0 y=0 w=1918 h=119)
     * ============================================================ */
    .top {
      position: absolute;
      left: 0; top: 0;
      width: 1918px; height: 119px;
      z-index: 10;
    }
    .top__logo {
      position: absolute;
      left: 46px; top: 39px;
      width: 200px; height: 40px;
    }
    .top__logo img { width: 100%; height: 100%; object-fit: contain; }

    /* Toast 提示(全局) */
    .toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 28px;
      font-family: var(--font-cn);
      font-size: 16px;
      color: #ffffff;
      background: rgba(11, 20, 57, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      white-space: nowrap;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .toast.is-show { opacity: 1; }

    /* ============================================================
     * 标题区 (title group, frame内 x=-43 y=129 w=1440 h=218)
     * 子元素坐标均为 frame 内绝对坐标
     * ============================================================ */
    /* 装饰底纹大字 (29:1135, frame内 x=-43 y=129 w=599 h=218)
       PNG alpha 仅 5%(Figma fill 0.05),CSS opacity 提到 2 让底纹可见 */
    .title__watermark {
      position: absolute;
      left: -43px; top: 129px;
      width: 599px; height: 218px;
      z-index: 5;
      opacity: 2;
    }
    /* 主标题 (29:1136, frame内 x=300 y=170 w=900 h=90) */
    .title__main {
      position: absolute;
      left: 300px; top: 170px;
      margin: 0;
      font-family: var(--font-title);
      font-size: 90px; font-weight: 400;
      line-height: 90px;
      white-space: nowrap;
      background: linear-gradient(135deg, #afc1e8 0%, #ffffff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      z-index: 10;
    }
    /* Pai Hang 手写装饰字 (29:1138, frame内 x=1131 y=133 w=266 h=122) */
    .title__decor {
      position: absolute;
      left: 1131px; top: 133px;
      font-family: var(--font-script);
      font-size: 72px; font-weight: 700;
      line-height: 1.2;
      color: #6999ff;
      white-space: nowrap;
      z-index: 10;
    }
    /* spark 装饰 (29:1137, frame内 x=1214 y=211 w=96 h=56) */
    .title__spark {
      position: absolute;
      left: 1214px; top: 211px;
      width: 96px; height: 56px;
      z-index: 10;
    }
    /* 副标题 (29:1140, frame内 x=300 y=280) */
    .title__sub {
      position: absolute;
      left: 300px; top: 280px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-en);
      font-size: 20px; font-weight: 400;
      color: var(--c-text-sub);
      white-space: nowrap;
      margin: 0;
      z-index: 10;
    }
    /* ============================================================
     * 奖牌区 (上移至原 userbar 位置,填补删除登录卡后的空白)
     * ============================================================ */
    .podium {
      position: absolute;
      left: 619px; top: 336px;
      width: 683px; height: 280px;
      z-index: 10;
    }
    .podium__card { position: absolute; }
    .podium__card .podium__bg {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
    .podium__card--silver { left: 0;    top: 20px; width: 182px; height: 260px; }
    .podium__card--gold   { left: 242px; top: 0;    width: 199px; height: 280px; }
    .podium__card--bronze { left: 501px; top: 20px; width: 182px; height: 260px; }

    /* 头像(圆形,位置相对各奖牌) */
    .podium__avatar {
      position: absolute;
      border-radius: 50%;
      object-fit: cover;
    }
    .podium__card--silver .podium__avatar { left: 60px; top: 26px; width: 60px; height: 60px; }
    .podium__card--gold   .podium__avatar { left: 68px; top: 27px; width: 64px; height: 64px; }
    .podium__card--bronze .podium__avatar { left: 61px; top: 26px; width: 60px; height: 60px; }

    /* 昵称/赛事/分数文字(位置相对各奖牌,整体水平居中于卡片) */
    .podium__name, .podium__event, .podium__score {
      position: absolute;
      left: 0;
      width: 100%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .podium__name {
      font-family: var(--font-cn);
      font-size: 16px; font-weight: 600;
      line-height: 22px;
    }
    .podium__event {
      font-family: var(--font-cn);
      font-size: 14px; font-weight: 400;
      line-height: 20px;
      color: #515e85;
    }
    .podium__score {
      font-family: var(--font-num);
      font-size: 16px; font-weight: 700;
      line-height: 28px;
      color: #ffffff;
      text-align: center;
      /* 蓝色渐变胶囊按钮(Figma Rectangle 34625000) */
      background: linear-gradient(180deg, #41507b 0%, #758abf 100%);
      border-radius: 999px;
      width: 100px;
      height: 28px;
      left: 50%;
      transform: translateX(-50%);
    }
    /* 银牌文字位置 */
    .podium__card--silver .podium__name  { top: 115px; background: linear-gradient(180deg, #9a9ebe 0%, #6b7283 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .podium__card--silver .podium__event { top: 146px; }
    .podium__card--silver .podium__score { top: 185px; }
    /* 金牌文字位置 */
    .podium__card--gold .podium__name  { top: 123px; background: linear-gradient(180deg, #bd945c 0%, #855e34 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .podium__card--gold .podium__event { top: 156px; }
    .podium__card--gold .podium__score { top: 198px; }
    /* 铜牌文字位置 */
    .podium__card--bronze .podium__name  { top: 115px; background: linear-gradient(180deg, #d9a27f 0%, #734934 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .podium__card--bronze .podium__event { top: 146px; }
    .podium__card--bronze .podium__score { top: 185px; }

    /* ============================================================
     * 排行榜表格 (frame内 x=300 y=792 w=1320)
     * 表格内文字按 Figma 精确 x 绝对定位
     * ============================================================ */
    .rank {
      position: absolute;
      left: 300px; top: 648px;
      width: 1320px;
      z-index: 10;
    }
    .rank__thead {
      position: relative;
      height: 48px;
      background: rgba(11, 20, 57, 0.20);
    }
    .rank__row {
      position: relative;
      height: 72px;
      background: rgba(255, 255, 255, 0.25);
    }
    /* 表头文字(frame内相对 .rank 起点 300) */
    .rank__head-rank   { position: absolute; left: 64px;  top: 13px; }
    .rank__head-player { position: absolute; left: 325px; top: 13px; }
    .rank__head-event  { position: absolute; left: 794px; top: 13px; }
    .rank__head-score  { position: absolute; left: 1223px; top: 13px; }
    /* 行内文字(frame内相对 .rank 起点 300, 行内 top 相对行起点) */
    .rank__cell-rank   { position: absolute; left: 64px;  top: 21px; }
    .rank__cell-player { position: absolute; left: 325px; top: 12px; width: 240px; height: 48px; display: flex; align-items: center; gap: 8px; }
    .rank__cell-event  { position: absolute; left: 794px; top: 25px; width: 420px; overflow: hidden; }
    .rank__cell-score  { position: absolute; left: 1223px; top: 26px; }

    .rank__thead span {
      font-family: var(--font-cn);
      font-size: 16px; font-weight: 600;
      color: var(--c-white);
      line-height: 22px;
    }
    .rank__num {
      font-family: var(--font-num);
      font-size: 24px; font-weight: 700;
      color: var(--c-table-text);
      line-height: 29px;
    }
    .rank__player { display: flex; align-items: center; gap: 8px; }
    .rank__avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid #515e85;
      object-fit: cover;
    }
    .rank__name {
      font-family: var(--font-cn);
      font-size: 16px; font-weight: 600;
      color: var(--c-table-text);
      line-height: 22px;
    }
    .rank__event {
      font-family: var(--font-cn);
      font-size: 16px; font-weight: 400;
      color: var(--c-table-text);
      line-height: 22px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rank__score {
      font-family: var(--font-num);
      font-size: 24px; font-weight: 700;
      color: var(--c-score);
      line-height: 29px;
    }

    /* ============================================================
     * 响应式断点框架(Phase R 架构重构 · 方案 A)
     * 核心思想:画布塌缩 + 坐标重映射。
     *   ≥1280px        桌面端:保持 1920 画布坐标系 + transform:scale 等比缩放,
     *                   零回归基准,本块内一字不动。
     *   <1280px        响应式:取消 scale 缩放,让 .stage__inner/.canvas 塌缩到
     *                   视口宽度,内部元素画布坐标(left/top/width/height)按
     *                   比例重映射为 calc(X/1920*100%),字号按 calc(F/1920*100vw)。
     * 所有规则物理隔离于上方桌面端 CSS,不触碰 ≥1280px 绝对定位坐标。
     * 本卡(R1)只搭骨架:画布塌缩 + 最外层容器坐标重映射 + 字号骨架。
     * 具体区块精细重排(导航 R2 / 奖牌 R3 / 表格 R4)留给后续卡。
     * ============================================================ */

    /* 平板(768~1279px):flex 流式布局
     * 与手机 <768px 共用同一套 flex 规则(消除 iPad 历史「画布塌缩 + calc
     * 百分比」半吊子方案导致的标题/奖牌/表格重叠),仅字号/间距略大。
     * 断点取 768~1279,使 ≥1280 桌面绝对定位零回归自洽。 */
    @media (min-width: 768px) and (max-width: 1279px) {
      body {
        padding: 0 24px;                 /* iPad 用稍大的左右内边距 */
        overflow-x: hidden;              /* 阻止画布 1920 横向溢出 */
      }

      /* —— 画布塌缩:让 .stage__inner/.canvas 跟随视口宽度,使内部元素
       *   position:relative 正常堆叠、position:absolute 不再以 1920 画布为锚 —— */
      .stage { justify-content: flex-start; width: 100%; }
      .stage__inner {
        width: 100% !important;
        transform: none !important;
        transform-origin: top left;
      }
      .canvas { width: 100%; min-height: auto; }

      /* —— 导航 flex 横向(只剩 Logo 左对齐) —— */
      .top {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        height: auto;
        display: flex;
        align-items: center;
        padding: 16px 0;
      }
      .top__logo {
        position: relative;
        left: auto; top: auto;
        width: 80px;
        height: auto;
        flex-shrink: 0;
      }
      .top__logo img { width: 100%; height: auto; }

      /* —— 标题区 flex 列堆叠(复用手机块结构) —— */
      .title__watermark {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        max-width: 200px;
        height: auto;
        opacity: 0.10;
        margin: 0 0 -28px;
      }
      .title__main {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        font-size: 32px;
        line-height: 1.3;
        white-space: normal;
        word-break: keep-all;
        margin: 0 0 6px;
      }
      .title__decor {
        position: relative;
        left: auto; top: auto;
        display: block;
        width: 100%;
        font-size: 24px;
        line-height: 1.2;
        text-align: right;
        opacity: 0.3;
        margin: -2px 0 6px;
      }
      .title__spark { display: none; }
      .title__sub {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        font-size: 14px;
        line-height: 1.5;
        white-space: normal;
        margin: 0 0 16px;
      }

      /* —— 奖牌 flex 列堆叠(复用手机块结构,间距略大) —— */
      .podium {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        margin: 4px 0 24px;
      }
      .podium__card {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        max-width: 240px;
        height: auto;
        aspect-ratio: 199 / 280;
      }
      .podium__card .podium__bg { width: 100%; height: 100%; }
      .podium__card--silver,
      .podium__card--gold,
      .podium__card--bronze {
        left: auto; top: auto;
      }
      .podium__card--gold   { order: 1; }
      .podium__card--silver { order: 2; }
      .podium__card--bronze { order: 3; }
      .podium__card--silver .podium__avatar,
      .podium__card--gold   .podium__avatar,
      .podium__card--bronze .podium__avatar {
        left: 50%;
        transform: translateX(-50%);
      }
      .podium__card--silver .podium__avatar { top: 10%; width: 22%; height: 22%; }
      .podium__card--gold   .podium__avatar { top: 10%; width: 24%; height: 24%; }
      .podium__card--bronze .podium__avatar { top: 10%; width: 22%; height: 22%; }
      .podium__name, .podium__event, .podium__score {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        text-align: center;
      }
      .podium__card--silver .podium__name  { top: 44%; }
      .podium__card--silver .podium__event { top: 56%; }
      .podium__card--silver .podium__score { top: 68%; }
      .podium__card--gold   .podium__name  { top: 44%; }
      .podium__card--gold   .podium__event { top: 57%; }
      .podium__card--gold   .podium__score { top: 71%; }
      .podium__card--bronze .podium__name  { top: 44%; }
      .podium__card--bronze .podium__event { top: 56%; }
      .podium__card--bronze .podium__score { top: 68%; }
      .podium__name  { font-size: 15px; line-height: 20px; }
      .podium__event { font-size: 13px; line-height: 18px; }
      .podium__score {
        font-size: 15px; line-height: 24px;
        width: 88px; height: 24px;
      }

      /* —— 排行榜 flex 四列(iPad 保留赛事列) —— */
      .rank {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        margin-top: 8px;
      }
      .rank__thead {
        display: flex;
        align-items: center;
        height: 44px;
        padding: 0 16px;
        gap: 16px;
      }
      .rank__row {
        display: flex;
        align-items: center;
        height: 64px;
        padding: 0 16px;
        gap: 16px;
        position: relative;
      }
      .rank__head-rank, .rank__cell-rank { position: static; flex: 0 0 48px; }
      .rank__head-player, .rank__cell-player { position: static; flex: 0 0 220px; }
      .rank__head-event, .rank__cell-event { position: static; flex: 1; min-width: 0; }
      .rank__head-score, .rank__cell-score { position: static; flex: 0 0 96px; text-align: right; }
      .rank__cell-player {
        display: flex;
        align-items: center;
        width: auto;
        height: 48px;
      }
      .rank__player { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
      .rank__event {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 14px;
        line-height: 20px;
      }
      .rank__name {
        font-size: 14px;
        line-height: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1; min-width: 0;
      }
      .rank__num   { font-size: 20px; line-height: 24px; }
      .rank__score { font-size: 20px; line-height: 24px; }
      .rank__avatar { width: 40px; height: 40px; flex-shrink: 0; }
    }

    /* 手机(<768px):flex 流式布局
     * 画布塌缩后(<1280)内部仍是绝对定位坐标,375px 下
     * 5.12× 缩放导致文字挤压/裁切不可用。本块改为相对定位 +
     * flex 流式,绝对定位 → 物理像素视口。
     *   导航:flex 横向(Logo + 双 tab)
     *   标题:flex 列堆叠(主标题换行 / Pai Hang·spark 装饰弱化或隐藏)
     *   奖牌:flex 列堆叠(每卡居中,头像绝对定位保留)
     *   表格:flex 三列紧凑(排名/玩家/积分),最近赛事列隐藏 */
    @media (max-width: 767px) {
      body {
        padding: 0 16px;                 /* 左右 16px 留白 */
        overflow-x: hidden;              /* 阻止画布 1920 横向溢出 */
      }

      /* —— 画布塌缩:同 iPad 块,让内部 position:relative 正常堆叠 —— */
      .stage { justify-content: flex-start; width: 100%; }
      .stage__inner {
        width: 100% !important;
        transform: none !important;
        transform-origin: top left;
      }
      .canvas { width: 100%; min-height: auto; }

      /* —— 导航 flex 横向(R5:移除双 tab,只剩 Logo 左对齐,body 已留 16px 空隙) —— */
      .top {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        height: auto;
        display: flex;
        align-items: center;
        padding: 14px 0;
      }
      .top__logo {
        position: relative;
        left: auto; top: auto;
        width: 72px;                       /* R5:R1 的 56px 偏小被遮挡,提到 72px */
        height: auto;
        flex-shrink: 0;
      }
      .top__logo img { width: 100%; height: auto; }

      /* —— 标题区 flex 列堆叠 —— */
      .title__watermark {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        max-width: 160px;
        height: auto;
        opacity: 0.10;                   /* PNG alpha 已很低,容器里再降到 0.10 不抢戏 */
        margin: 0 0 -28px;
        order: 0;                        /* 最先(背景) */
      }
      .title__main {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        font-size: 26px;
        line-height: 1.3;
        white-space: normal;
        word-break: keep-all;
        margin: 0 0 6px;
        order: 1;
      }
      /* 装饰大字 / spark 在极窄屏占位且与主标题抢空间,弱化展示 */
      .title__decor {
        position: relative;
        left: auto; top: auto;
        display: block;
        width: 100%;
        font-size: 20px;
        line-height: 1.2;
        text-align: right;
        opacity: 0.3;
        margin: -2px 0 6px;
        order: 2;
      }
      .title__spark {
        display: none;                    /* 极窄屏隐藏,避免与 Pai Hang 重叠 */
      }
      .title__sub {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        font-size: 12px;
        line-height: 1.5;
        white-space: normal;
        margin: 0 0 12px;
        order: 3;
      }

      /* —— 奖牌 flex 列堆叠 —— */
      .podium {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin: 4px 0 16px;
      }
      .podium__card {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        max-width: 200px;
        height: auto;
        aspect-ratio: 199 / 280;          /* 以金牌为基准,银/铜同框等比 */
      }
      .podium__card .podium__bg { width: 100%; height: 100%; }
      .podium__card--silver,
      .podium__card--gold,
      .podium__card--bronze {
        left: auto; top: auto;            /* 覆盖桌面 left/top 定位 */
      }
      /* R2:极窄屏按名次排序 金(1)→银(2)→铜(3),
       * 桌面端横向顺序(银→金→铜)由绝对定位 left 决定,不受 order 影响 */
      .podium__card--gold   { order: 1; }
      .podium__card--silver { order: 2; }
      .podium__card--bronze { order: 3; }
      .podium__card--silver .podium__avatar,
      .podium__card--gold   .podium__avatar,
      .podium__card--bronze .podium__avatar {
        /* 头像在卡内居中,百分比相对卡片宽 */
        left: 50%;
        transform: translateX(-50%);
      }
      .podium__card--silver .podium__avatar { top: 10%; width: 22%; height: 22%; }
      .podium__card--gold   .podium__avatar { top: 10%; width: 24%; height: 24%; }
      .podium__card--bronze .podium__avatar { top: 10%; width: 22%; height: 22%; }
      /* 文字位置改为相对卡片底部百分位,跟随卡片等比 */
      .podium__name, .podium__event, .podium__score {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        text-align: center;
      }
      .podium__card--silver .podium__name  { top: 44%; }
      .podium__card--silver .podium__event { top: 56%; }
      .podium__card--silver .podium__score { top: 68%; }
      .podium__card--gold   .podium__name  { top: 44%; }
      .podium__card--gold   .podium__event { top: 57%; }
      .podium__card--gold   .podium__score { top: 71%; }
      .podium__card--bronze .podium__name  { top: 44%; }
      .podium__card--bronze .podium__event { top: 56%; }
      .podium__card--bronze .podium__score { top: 68%; }
      .podium__name  { font-size: 13px; line-height: 18px; }
      .podium__event { font-size: 11px; line-height: 16px; }
      .podium__score {
        font-size: 13px; line-height: 22px;
        width: 80px; height: 22px;
      }

      /* —— 排行榜 flex 三列 —— */
      .rank {
        position: relative;
        left: auto; top: auto;
        width: 100%;
        margin-top: 8px;
      }
      .rank__thead {
        display: flex;
        align-items: center;
        height: 40px;
        padding: 0 12px;
        gap: 12px;
      }
      .rank__row {
        display: flex;
        align-items: center;
        height: 64px;
        padding: 0 12px;
        gap: 12px;
        position: relative;
      }
      .rank__head-event, .rank__cell-event { display: none; }  /* 隐藏最近赛事列 */
      .rank__head-rank   { position: static; flex: 0 0 40px; }
      .rank__head-player { position: static; flex: 1; min-width: 0; }
      .rank__head-score  { position: static; flex: 0 0 72px; text-align: right; }
      .rank__cell-rank   {
        position: static;
        flex: 0 0 40px;
      }
      .rank__cell-player {
        position: static;
        flex: 1;
        min-width: 0;
        width: auto;
        height: 48px;
      }
      .rank__cell-score  {
        position: static;
        flex: 0 0 72px;
        text-align: right;
      }
      .rank__num   { font-size: 20px; line-height: 24px; }
      .rank__name  {
        font-size: 14px; line-height: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1; min-width: 0;
      }
      .rank__avatar { width: 40px; height: 40px; flex-shrink: 0; }
      .rank__score  { font-size: 18px; line-height: 22px; }
    }
  </style>
</head>
<body>
  <!-- 背景层:置于 .stage 之外,避免被 .stage__inner 的 transform 劫持 containing block,
       使 position:fixed 真正相对视口定位,铺满任意屏幕 -->
  <div class="bg">
    <img class="bg__base" src="assets/full/bg_layer1.png" alt="">
  </div>

  <div class="stage">
    <div class="stage__inner">
  <div class="canvas">
    <!-- 顶部导航 -->
    <header class="top">
      <a class="top__logo" href="https://wxq.qq.com/" target="_blank" rel="noopener"><img src="assets/full/logo.png" alt="王者万象棋"></a>
    </header>

    <!-- 标题区 -->
    <img class="title__watermark" src="assets/full/watermark_paihang.png" alt="" aria-hidden="true">
    <h1 class="title__main">万象王牌·世界排行榜</h1>
    <span class="title__decor" aria-hidden="true">Pai Hang</span>
    <img class="title__spark" src="assets/full/decor_vector.png" alt="" aria-hidden="true">
    <p class="title__sub">
      当前为测试和体验期间抢先榜单，正式发布后将重置。后续人人都可登上排名，冲击最高舞台！
    </p>

    <!-- 奖牌区 -->
    <section class="podium">
      <div class="podium__card podium__card--silver">
        <img class="podium__bg" src="assets/full/podium_bg_silver.png" alt="亚军">
        <img class="podium__avatar" src="assets/full/podium_avatar_silver.png" alt="">
        <span class="podium__name"></span>
        <span class="podium__event"></span>
        <span class="podium__score"></span>
      </div>
      <div class="podium__card podium__card--gold">
        <img class="podium__bg" src="assets/full/podium_bg_gold.png" alt="冠军">
        <img class="podium__avatar" src="assets/full/podium_avatar_gold.png" alt="">
        <span class="podium__name"></span>
        <span class="podium__event"></span>
        <span class="podium__score"></span>
      </div>
      <div class="podium__card podium__card--bronze">
        <img class="podium__bg" src="assets/full/podium_bg_bronze.png" alt="季军">
        <img class="podium__avatar" src="assets/full/podium_avatar_bronze.png" alt="">
        <span class="podium__name"></span>
        <span class="podium__event"></span>
        <span class="podium__score"></span>
      </div>
    </section>

    <!-- 排行榜表格 -->
    <section class="rank">
      <div class="rank__thead">
        <span class="rank__head-rank">排名</span>
        <span class="rank__head-player">玩家</span>
        <span class="rank__head-event">最近赛事</span>
        <span class="rank__head-score">积分</span>
      </div>
      <div id="rank-body"></div>
    </section>
  </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <!-- 数据文件(script 标签加载,兼容 file:// 双击打开) -->
  <script src="data/rank.js"></script>
  <script>
    // 响应式:按视口宽度等比缩放 canvas(设计稿 1920 宽)
    // 移动端:允许横向滚动查看完整内容,避免缩成蚂蚁字
    function fitStage() {
      var stageInner = document.querySelector('.stage__inner');
      if (!stageInner) return;
      var vw = window.innerWidth;
      // 响应式断点(1279px)以下不再做 scale 缩放,
      // 否则会覆盖 <1280 断点 CSS 的 !important 规则,
      // 导致 fitStage 持续写入 transform: scale(...) 内联样式,
      // 把 1920 画布按比例缩小而非塌缩。
      if (vw < 1280) {
        stageInner.style.transform = '';
        var stageEl = document.querySelector('.stage');
        if (stageEl) stageEl.style.height = '';
        return;
      }
      // 桌面(< 1920 仍等比,>= 1920 按 1 渲染)
      var scale = vw >= 1920 ? 1 : vw / 1920;
      stageInner.style.transform = 'scale(' + scale + ')';
      var canvasEl = document.querySelector('.canvas');
      if (canvasEl) {
        document.querySelector('.stage').style.height = (canvasEl.offsetHeight * scale) + 'px';
      }
    }
    window.addEventListener('resize', fitStage);
    window.addEventListener('load', fitStage);

    function render(list) {
      var body = document.getElementById('rank-body');
      body.innerHTML = '';
      list.forEach(function (p) {
        var row = document.createElement('div');
        row.className = 'rank__row';

        var cellRank = document.createElement('div');
        cellRank.className = 'rank__cell-rank';
        var num = document.createElement('span');
        num.className = 'rank__num';
        num.textContent = (p.rank < 10 ? '0' + p.rank : '' + p.rank);
        cellRank.appendChild(num);
        row.appendChild(cellRank);

        var cellPlayer = document.createElement('div');
        cellPlayer.className = 'rank__cell-player';
        var player = document.createElement('div');
        player.className = 'rank__player';
        // 仅当有 avatar 时才渲染头像(前三名保留, 第 4 名起隐藏)
        if (p.avatar) {
          var avatar = document.createElement('img');
          avatar.className = 'rank__avatar';
          avatar.src = p.avatar;
          avatar.alt = p.name;
          player.appendChild(avatar);
        }
        var name = document.createElement('span');
        name.className = 'rank__name';
        name.textContent = p.name;
        player.appendChild(name);
        cellPlayer.appendChild(player);
        row.appendChild(cellPlayer);

        var cellEvent = document.createElement('div');
        cellEvent.className = 'rank__cell-event';
        var event = document.createElement('span');
        event.className = 'rank__event';
        event.textContent = p.event;
        cellEvent.appendChild(event);
        row.appendChild(cellEvent);

        var cellScore = document.createElement('div');
        cellScore.className = 'rank__cell-score';
        var score = document.createElement('span');
        score.className = 'rank__score';
        score.textContent = (typeof p.score === 'number' ? p.score.toLocaleString('en-US') : p.score);
        cellScore.appendChild(score);
        row.appendChild(cellScore);

        body.appendChild(row);
      });

      // 动态撑开画布高度:表格顶部 y=648 + 表头48 + 行数*72 + 底部留白
      var canvasHeight = 648 + 48 + list.length * 72 + 80;
      document.querySelector('.canvas').style.height = canvasHeight + 'px';
      // <1280 视口下 fitStage 已短路(不再做 scale),直接返回;
      // ≥1280 才需要 fitStage 重算 stage 高度
      if (window.innerWidth >= 1280) fitStage();
    }

    // 渲染前 3 名奖牌(按真实名次分配奖牌类型,支持并列)
    // 卡位固定: 左=银牌位, 中=金牌位, 右=铜牌位
    // 规则: 按 top3 每个选手的真实 rank 分配:
    //   rank=1 → 金牌; rank=2 → 银牌; rank=3 → 铜牌
    // 并列时(如两个 rank=2 并列第 2): 右卡位(原铜牌)也切为银牌样式
    function renderPodium(top3) {
      var list = (top3 || []);
      // 三个卡位与选手的对应(按分数降序 list[0] 最高)
      var slots = [
        { medal: 'silver', index: 1 },  // 左卡位 ← list[1](第二名)
        { medal: 'gold',   index: 0 },  // 中卡位 ← list[0](第一名)
        { medal: 'bronze', index: 2 }   // 右卡位 ← list[2](第三名)
      ];
      // 并列检测: 若 list[2] 与 list[1] 同 rank(并列第 2),右卡位切为银牌
      var rankOfRight = list[2] ? list[2].rank : null;
      var rankOfLeft = list[1] ? list[1].rank : null;
      var rightIsSilver = (list.length >= 3 && rankOfRight !== null && rankOfRight === rankOfLeft);

      slots.forEach(function (slot) {
        var p = list[slot.index];
        if (!p) return;
        var card = document.querySelector('.podium__card--' + slot.medal);
        if (!card) return;
        // 若右卡位需从铜牌切为银牌(并列第 2)
        if (slot.index === 2 && rightIsSilver) {
          var bg2 = card.querySelector('.podium__bg');
          var av2 = card.querySelector('.podium__avatar');
          var nm2 = card.querySelector('.podium__name');
          if (bg2) bg2.src = 'assets/full/podium_bg_silver.png';
          if (av2) av2.src = 'assets/full/podium_avatar_silver.png';
          // 昵称文字颜色也从铜色切为银灰色渐变(与银牌一致)
          if (nm2) {
            nm2.style.background = 'linear-gradient(180deg, #9a9ebe 0%, #6b7283 100%)';
            nm2.style.webkitBackgroundClip = 'text';
            nm2.style.backgroundClip = 'text';
            nm2.style.color = 'transparent';
          }
        }
        var name = card.querySelector('.podium__name');
        var event = card.querySelector('.podium__event');
        var score = card.querySelector('.podium__score');
        var avatar = card.querySelector('.podium__avatar');
        if (name) name.textContent = p.name;
        if (event) event.textContent = p.event;
        if (score) score.textContent = (typeof p.score === 'number' ? p.score.toLocaleString('en-US') : p.score);
        if (avatar && p.avatar) avatar.src = p.avatar;
      });
    }

    // 数据由 data/rank.js 通过 script 标签加载(window.RANK_DATA),兼容 file:// 与 http://
    function boot() {
      var data = window.RANK_DATA;
      if (!data) {
        document.getElementById('rank-body').innerHTML =
          '<div class="rank__row" style="display:flex;align-items:center;justify-content:center;color:#bfc4d9;font-size:16px;">榜单数据加载失败，请检查 data/rank.js</div>';
        return;
      }
      renderPodium(data.top3 || []);
      render(data.list || []);
    }

    boot();
  </script>
</body>
</html>
